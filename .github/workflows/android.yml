name: Android 打包

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 授权 gradlew 可执行
        run: chmod +x gradlew

      # 版本号按构建时间生成（1.0.MMddHHmm，UTC），看 APK 名就能区分是哪次构建
      - name: 打包 Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      # Release 用仓库内 debug.keystore 签名；首次跑 CI 若 proguard 有问题不阻塞 Debug 产物
      - name: 打包 Release APK
        run: ./gradlew :app:assembleRelease --stacktrace
        continue-on-error: true

      - name: 整理产物
        run: |
          mkdir -p apk-out
          cp app/build-zen/outputs/apk/debug/app-debug.apk "apk-out/陪陪刷-debug-r${{ github.run_number }}.apk"
          if [ -f app/build-zen/outputs/apk/release/app-release.apk ]; then
            cp app/build-zen/outputs/apk/release/app-release.apk "apk-out/陪陪刷-release-r${{ github.run_number }}.apk"
          fi
          ls -la apk-out/

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-r${{ github.run_number }}
          path: apk-out/*.apk
          if-no-files-found: error
          retention-days: 30

      # 推 v* 标签时自动创建 GitHub Release 并附上 APK
      - name: 发布到 Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apk-out/*.apk
          generate_release_notes: true
